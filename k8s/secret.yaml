# DEV PLACEHOLDER. Do not commit real credentials. In production create this from
# your secret manager (External Secrets, Sealed Secrets, SOPS) or:
#   kubectl -n product-service create secret generic product-service-secrets \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=DATABASE_URL=...
# Use a URL-safe password: DATABASE_URL embeds it.
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me-please
  DATABASE_URL: postgresql+psycopg://postgres:change-me-please@postgres:5432/products

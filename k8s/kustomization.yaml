apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-service
resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
# Point at your registry image for real clusters:
#   cd k8s && kustomize edit set image product-service=myregistry.io/team/product-service:1.0.0
images:
  - name: product-service
    newName: product-service
    newTag: 1.0.0
